[pytest]
#参数
addopts = -ra -q
# 默认的执行路径，它会默认执行该文件夹下所有的满足条件的测试case
testpaths = test
# 文件命名规则
python_files = test_*.py
# 类名命名规则
python_classes = Test*
# Case命名规则
python_functions = test_*

log_format = %(asctime)s %(levelname)s %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

asyncio_default_fixture_loop_scope = function