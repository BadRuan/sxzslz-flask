{% extends "admin/components/base.html" %}

{% block title %}文章发布{% endblock %}

{% block content %}
<div class="flex h-screen overflow-hidden">
    {% include 'admin/components/sidebar.html' %}

            <div class="flex-1 flex flex-col overflow-hidden">
            {% include 'admin/components/header.html' %}

            <!-- 主内容 -->
            <main class="flex-1 overflow-y-auto p-6">
                <h2 class="text-xl font-bold text-gray-900 mb-6">新增文章</h2>

                <div class="bg-white rounded-lg shadow-xs ring-1 ring-border p-6 max-w-4xl">
                    <form class="space-y-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">标题</label>
                            <input type="text" class="w-full rounded-md border border-border px-3 py-2 text-sm" />
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">摘要</label>
                            <textarea rows="4"
                                class="w-full rounded-md border border-border px-3 py-2 text-sm"></textarea>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">分类</label>
                                <select class="w-full rounded-md border border-border px-3 py-2 text-sm">
                                    <option>要闻动态</option>
                                    <option>通知公告</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">发布时间</label>
                                <input type="date" class="w-full rounded-md border border-border px-3 py-2 text-sm" />
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">正文</label>
                            <textarea rows="16"
                                class="w-full rounded-md border border-border px-3 py-2 text-sm"></textarea>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">封面图片上传</label>
                            <input type="file" class="w-full text-sm" />
                        </div>

                        <div class="flex justify-end gap-3 pt-4 border-t border-border">
                            <button type="submit"
                                class="rounded-md bg-primary px-4 py-2 text-sm font-semibold text-white">立即发布</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>

</div>
{% endblock %}
